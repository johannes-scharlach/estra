# Deploys apps/api to Fly when API sources change. Same deploy as
# `pnpm api:deploy`, run from the checkout root (the build context needs
# the pnpm lockfile above apps/api). Requires:
#   - repo secret FLY_API_TOKEN — an app-scoped deploy token:
#       fly tokens create deploy --app estra-api
#
# Secrets (SUPABASE_URL, DATABASE_URL, GOOGLE_GENERATIVE_AI_API_KEY) live
# on the Fly app itself (`fly secrets set`), not in GitHub.
name: api-deploy
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config apps/api/fly.toml --dockerfile apps/api/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
