# Deploys PowerSync sync rules when they change. Requires:
#   - powersync/cli.yaml committed (written once by `powersync link cloud`)
#   - repo secret POWERSYNC_ADMIN_TOKEN (PAT from the PowerSync dashboard)
#
# Deliberately `deploy sync-config`, not `deploy`: full deploy pushes
# service.yaml too, and the repo's service.yaml is the local Docker stack,
# not the Cloud instance's real service config.
name: powersync-sync-config
on:
  push:
    branches: [main]
    paths: ["powersync/sync-config.yaml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pinned: the CLI had a breaking redesign in 0.9.0; bump deliberately.
      - run: npx powersync@0.10.0 validate --directory powersync
        env:
          PS_ADMIN_TOKEN: ${{ secrets.POWERSYNC_ADMIN_TOKEN }}
      - run: npx powersync@0.10.0 deploy sync-config --directory powersync
        env:
          PS_ADMIN_TOKEN: ${{ secrets.POWERSYNC_ADMIN_TOKEN }}
