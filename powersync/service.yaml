# PowerSync Cloud instance config. The connection and client auth are set
# in the PowerSync dashboard; this file mirrors what it holds (pulled with
# `powersync pull instance`, password kept as a cloud-side secret). Only
# sync-config.yaml is deployed from the repo — the CI workflow uses
# `deploy sync-config`, so this file is documentation, not a deploy source.
#
# The sync rules in sync-config.yaml are shared with the local Docker
# stack (local-service.yaml).
_type: cloud

name: Production
region: eu

replication:
  connections:
    # powersync_role: REPLICATION + BYPASSRLS + SELECT-only, created in
    # supabase/migrations/20260818100100. Password issued out of band.
    - type: postgresql
      uri: postgresql://powersync_role@db.hipfjgdphtdzumzsltog.supabase.co:5432/postgres
      password:
        # Cloud-side secret reference; the value lives in the dashboard.
        secret_ref: default_password
      hostname: db.hipfjgdphtdzumzsltog.supabase.co
      port: 5432
      database: postgres
      username: powersync_role
      name: Default
      tag: default
      sslmode: verify-full
      debug_api: false

client_auth:
  supabase: true
  additional_audiences: []
  allow_temporary_tokens: false
