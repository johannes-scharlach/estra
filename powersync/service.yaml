# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
#
# Self-hosted PowerSync service config. This file is only used by the local
# Docker stack — on PowerSync Cloud the equivalent settings live in the
# dashboard. The sync rules in sync-config.yaml are shared by both.

telemetry:
  disable_telemetry_sharing: false

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      # The service reaches Postgres over Supabase's internal Docker
      # network, so there is nothing in between to encrypt against.
      # A hosted instance connecting over the internet must use verify-full.
      sslmode: disable

# PowerSync keeps its sync buckets in MongoDB, not in Postgres.
storage:
  type: mongodb
  uri: !env PS_MONGO_URI

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  # Verifies the Supabase-issued JWT the app sends.
  supabase: true
  # ES256 asymmetric signing: PowerSync fetches the public key itself, so
  # there is no shared secret to keep in sync. `kong` is Supabase's local
  # gateway container.
  jwks_uri: http://kong:8000/auth/v1/.well-known/jwks.json
  audience: ["authenticated"]
