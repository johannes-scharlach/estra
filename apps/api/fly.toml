# fly.toml for apps/api. Deploy from the repo root so the Docker build
# context includes the pnpm lockfile:
#
#   pnpm api:deploy
#
# First time, create the app without deploying:
#   fly apps create estra-api            # or `fly launch --no-deploy`
#   fly secrets set SUPABASE_URL=https://<project-ref>.supabase.co \
#     GOOGLE_GENERATIVE_AI_API_KEY=... --app estra-api

app = "estra-api"
primary_region = "fra"

# No [build] section: the Dockerfile path is passed on the command line,
# because it is relative to the build context (the repo root) rather than
# to this file.

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Cold start on the first request. Raise to 1 once someone is waiting on
  # a chat response and the extra second is noticeable.
  min_machines_running = 0
  processes = ["app"]

  # Hand responses to the client exactly as written. Fly's proxy does not
  # buffer bodies, but pristine mode also stops it rewriting headers, which
  # is what keeps SSE chunks flushing one at a time.
  [http_service.http_options.response]
    pristine = true

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
